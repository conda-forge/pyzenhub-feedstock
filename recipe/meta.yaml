{% set name = "pyzenhub" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 26ecafccbd00edd652fbc8204fa218c25eaa89fc827db70e3fa9a4ea7384c910

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools-scm
  run:
    - packaging
    - pydantic <2
    - python >={{ python_min }}
    - requests
    - types-requests
    - typing-extensions

test:
  imports:
    - zenhub
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/goanpeca/pyzenhub
  summary: Python bindings to the Zenhub API
  dev_url: https://github.com/goanpeca/pyzenhub
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - goanpeca
